name = "ears-live"
main = "src/index.js"
compatibility_date = "2026-01-01"

rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true },
]

# Static downloads (the beta DMG). Assets are served before the Worker for
# matching paths, so /UDITO-beta.dmg just works.
[assets]
directory = "public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "LiveSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveSession"]
